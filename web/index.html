<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>SOUND</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="box">
      <div class="brand"><img src="logo.png" alt="SOUND"><i class="logo-tint" role="img" aria-label="SOUND"></i></div>
      <nav class="nav" id="nav">
        <a data-page="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Ana sayfa</a>
        <a data-page="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Ara</a>
        <a data-page="favorites" data-drop="favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favoriler</a>
        <a data-page="downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>İndirilenler</a>
      </nav>
    </div>
    <div class="box lib">
      <div class="lib-head" data-drop="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4v16M9 4v16M14 4l6 16"/></svg>
        <span class="grow">Kitaplığın</span>
        <button class="round-btn" id="newBtn" title="Yeni albüm ya da klasör"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="libList" data-drop="library"></div>
      <div class="account" id="accountBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</div>
    </div>
  </aside>

  <main id="main" class="box">
    <div id="topbar">
      <button class="hist" id="backBtn" title="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="hist" id="fwdBtn" title="İleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 5 7 7-7 7"/></svg></button>
      <button class="hist" id="undoBtn" data-act="undo" title="Geri alınacak bir şey yok" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <div class="searchwrap"><label class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" placeholder="Ne dinlemek istiyorsun?" spellcheck="false" autocomplete="off">
        <button class="clear hidden" id="searchClear" title="Temizle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label><div id="searchDrop" class="hidden"></div></div>
    </div>
    <div id="scroll"><div id="glow"></div><div id="page"></div></div>
  </main>

  <aside id="panel" class="box"><div class="inner" id="panelInner"></div></aside>

  <footer id="bar">
    <div class="np" id="np"></div>
    <div class="center">
      <div class="ctrl">
        <button class="ib" id="shuffleBtn" title="Karışık çal"></button>
        <button class="ib" id="prevBtn" title="Önceki"></button>
        <button class="pp" id="ppBtn" title="Çal"></button>
        <button class="ib" id="nextBtn" title="Sonraki"></button>
        <button class="ib" id="repeatBtn" title="Tekrarla"></button>
      </div>
      <div class="prog"><span id="t0">0:00</span><canvas id="flame"></canvas><span id="t1">0:00</span></div>
    </div>
    <div class="right">
      <button class="ib" id="panelBtn" title="Şimdi çalıyor paneli"></button>
      <button class="ib" id="muteBtn" title="Sesi kapat"></button>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>
  </footer>
</div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
